<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F5F7F5"><title>Intro Review</title>
  <style>
    :root{color-scheme:light;--bg:#f5f7f5;--panel:#ffffff;--line:#d9dfda;--muted:#68736c;--mint:#00b982;--text:#171c19;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 70% -10%,#e4f8ef 0,transparent 43%),var(--bg);color:var(--text);min-height:100vh}button,input,textarea{font:inherit}button{cursor:pointer;color:inherit}.shell{max-width:1440px;margin:auto;padding:32px clamp(18px,4vw,60px) 70px}h1{font-size:clamp(36px,6vw,64px);letter-spacing:-.065em;line-height:.98;font-weight:560;margin:22px 0 18px}.bar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:18px}.pages{display:flex;gap:6px}.pill{border:1px solid var(--line);background:#ffffff;padding:9px 13px;border-radius:8px;color:#4e5a53;font-size:12px}.pill.active{background:var(--mint);border-color:var(--mint);color:#101210;font-weight:650}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid[data-count="1"]{grid-template-columns:minmax(0,1fr);max-width:850px}.grid[data-count="2"]{grid-template-columns:repeat(2,minmax(0,1fr))}.grid[data-count="3"],.grid[data-count="4"]{grid-template-columns:repeat(2,minmax(0,1fr))}.card{position:relative;min-height:180px;aspect-ratio:16/10;background:#ffffff;border:1px solid var(--line);border-radius:12px;overflow:hidden;transition:transform .18s,border-color .18s}.card:hover{transform:translateY(-2px);border-color:#68726b}.card video{width:100%;height:100%;object-fit:cover;display:block;background:#eef2ee}.card button{position:absolute;inset:0;border:0;background:transparent;text-align:left}.card-label{position:absolute;bottom:12px;left:13px;padding:6px 9px;background:#ffffffed;border:1px solid #171c1921;border-radius:6px;font-size:11px;color:#171c19}.empty{grid-column:1/-1;padding:65px 24px;border:1px dashed #cbd4cd;border-radius:12px;text-align:center;color:var(--muted)}.empty b{display:block;color:var(--text);font-size:17px;margin-bottom:8px}.sheet{position:fixed;inset:0;background:#f5f7f5f5;display:none;z-index:4;overflow:auto}.sheet.open{display:block}.close{position:fixed;top:18px;right:24px;border:1px solid #d9dfda;background:#ffffff;padding:10px 14px;border-radius:8px;z-index:6}.review{width:100%;max-width:1680px;margin:auto;padding:64px clamp(15px,3vw,48px) 48px;display:flex;flex-direction:column;gap:26px}.player{width:100%}.player video{display:block;width:100%;max-height:calc(100vh - 90px);aspect-ratio:16/9;background:#edf1ed;object-fit:contain;border-radius:12px}.detail{width:100%;padding:4px 5px}.comment-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.comment-action{border:1px solid var(--line);background:white;padding:5px 9px;border-radius:6px;font-size:12px}[hidden]{display:none!important}.detail h2{margin:0 0 7px;font-size:25px;letter-spacing:-.04em}.detail p{margin:0;color:var(--muted);font-size:13px}.comments{margin-top:24px}.comments h3{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}.form{display:grid;gap:8px;margin:14px 0 18px;width:33.333%}.form input,.form textarea{width:100%;background:#ffffff;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:11px}.form textarea{min-height:85px;resize:vertical}.send{background:var(--mint);border:0;color:#0f1411;border-radius:8px;padding:10px;font-weight:650}.comment{padding:13px 0;border-top:1px solid var(--line)}.comment strong{font-size:12px}.comment time{font:10px ui-monospace,monospace;color:var(--muted);margin-left:8px}.comment p{font-size:13px;line-height:1.5;margin:6px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}.status{font-size:12px;color:var(--muted);min-height:18px}.foot{margin-top:38px;color:#707873;font-size:11px}@media(max-width:900px){.form{width:100%;max-width:480px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.grid[data-count="1"]{grid-template-columns:minmax(0,1fr)}.review{grid-template-columns:1fr;padding-top:70px}}@media(max-width:540px){.shell{padding-inline:14px}.grid,.grid[data-count]{grid-template-columns:1fr}.card{min-height:0}.review{padding-inline:15px}}
  .review-prompt{margin:0 0 28px;color:var(--muted);font-size:15px;line-height:1.5}.sections{display:flex;gap:8px;margin:-5px 0 28px;flex-wrap:wrap}.section{border:1px solid var(--line);border-radius:9px;padding:11px 18px;background:white;font-size:15px}.section.active{background:var(--text);color:white;border-color:var(--text)}.audio-card{aspect-ratio:auto;min-height:0;padding:20px;display:flex;flex-direction:column;gap:14px}.audio-card .audio-title{position:static;inset:auto;text-align:left;font-size:18px;font-weight:650;border:0;padding:0;background:none}.audio-card audio{width:100%;min-width:0;height:54px;flex-shrink:0}.audio-review{max-width:760px;width:100%;padding:40px 0}.audio-review audio{width:100%}.audio-label{font-size:14px;color:var(--muted);margin-bottom:16px}.card .review-audio{position:static;inset:auto;padding:9px 12px;border:1px solid var(--line);border-radius:7px;background:white;text-align:left;align-self:flex-start}.sheet.audio-sheet .review{max-width:1680px}.load-error{grid-column:1/-1;color:var(--muted);padding:35px}

.hover-actions{position:absolute;inset:0;z-index:2;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px 16px;background:linear-gradient(transparent,rgba(8,18,12,.78));pointer-events:none;opacity:0;transition:opacity .16s}.card .hover-actions button{position:static;inset:auto;border:1px solid #ffffff70;background:#ffffffed;color:#171c19;border-radius:9px;padding:10px 17px;text-align:center;font-weight:600;min-height:44px}.hover-action-stack{width:min(100%,300px);display:grid;gap:9px}.hover-votes{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card .hover-votes button{min-width:0;font-size:22px;padding-inline:10px}.card .hover-action-stack>button{width:100%}.card .hover-actions button:hover,.card .hover-actions button:focus-visible{background:#00e89c;color:#071f17}.card .card-label{transition:opacity .15s}@media(hover:hover) and (pointer:fine){.hover-actions{display:flex}.card:hover .hover-actions,.card:focus-within .hover-actions{opacity:1}.card:hover .hover-actions button,.card:focus-within .hover-actions button{pointer-events:auto}.card:hover .card-label,.card:focus-within .card-label{opacity:0}}.card .card-open{z-index:1}.audio-card{position:relative}.jingle-action-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}.jingle-votes{display:flex;gap:8px}.card .jingle-actions button{position:static;inset:auto;min-height:44px;border:1px solid var(--line);border-radius:8px;background:white;padding:10px 14px;font-weight:600;text-align:center}.card .jingle-votes button{font-size:22px;padding:6px 12px}.card .jingle-actions button:hover,.card .jingle-actions button:focus-visible{background:#daf8eb;border-color:#008a61}.audio-card:hover{transform:none}.feedback-picks{border:0;padding:0;margin:0 0 5px;display:flex;gap:8px;flex-wrap:wrap}.feedback-picks legend{font-size:13px;color:var(--muted);margin-bottom:8px}.feedback-picks button{display:inline-flex;align-items:center;gap:8px;min-height:44px;border:1px solid var(--line);border-radius:8px;background:white;padding:10px 13px;color:var(--text)}.feedback-picks button[aria-pressed=true]{border-color:#008a61;background:#daf8eb;box-shadow:0 0 0 1px #008a61}.comment-reaction{font-size:12px;background:#edf2ee;padding:4px 8px;border-radius:5px}.comments{scroll-margin-top:75px}.player video:fullscreen{width:100vw;height:100vh;max-height:none;aspect-ratio:auto;background:#000;object-fit:contain}.sheet:fullscreen{background:var(--bg);overflow:auto}.sheet:-webkit-full-screen{background:var(--bg);overflow:auto}@media(hover:none),(pointer:coarse){.hover-actions{display:none!important}}@media(max-width:767px){.hover-actions{display:none!important}}@media(max-width:900px) and (orientation:landscape){.review{padding-top:60px}.player video{max-height:calc(100dvh - 70px)}}@media(prefers-reduced-motion:reduce){.hover-actions,.card{transition:none}}

.grid,.grid[data-count]{grid-template-columns:repeat(3,minmax(0,1fr));max-width:none}.card.intro-card{aspect-ratio:auto;min-height:0;display:flex;flex-direction:column}.card .preview-open{position:relative;inset:auto;display:block;width:100%;padding:0;aspect-ratio:16/10;overflow:hidden}.card-front{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px;flex-wrap:wrap}.card .card-front button{position:static;inset:auto;min-height:40px;border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:white}.card .open-label{font-size:14px;font-weight:600}.front-votes{display:flex;gap:5px}.card .front-votes button{font-size:19px}.card .front-votes button:hover{background:#daf8eb;border-color:#008a61}.audio-card .card-front{padding:0}.audio-title{margin:0}.leave-feedback{border:1px solid var(--line);background:white;border-radius:8px;padding:12px 18px}#feedback-dialog{width:min(550px,calc(100% - 28px));border:1px solid var(--line);border-radius:16px;padding:26px;color:var(--text);box-shadow:0 24px 90px #0003}#feedback-dialog::backdrop{background:#10291c66}#feedback-dialog h2{margin:0 0 20px;font-size:24px}#feedback-dialog .form{width:100%;max-width:none}#feedback-cancel{border:0;background:transparent;padding:10px;color:var(--muted)}@media(max-width:1000px){.grid,.grid[data-count]{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.grid,.grid[data-count]{grid-template-columns:1fr}}

#feedback-dialog{font-size:18px}#feedback-dialog .feedback-picks legend{font-size:16px}#feedback-dialog .feedback-picks{display:grid;gap:10px}#feedback-dialog .feedback-picks button{font-size:18px}.detail-choices{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.detail-choices button{border:1px solid var(--line);background:white;border-radius:8px;padding:12px 16px;font-size:17px;min-height:46px}.detail-choices button:hover{background:#daf8eb}.send:disabled{background:#e1e5e2;color:#879089;cursor:not-allowed}.comment-reveal{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .25s ease,opacity .25s ease}.comment-reveal>div{overflow:hidden;min-height:0}.comment-reveal.expanded{grid-template-rows:1fr;opacity:1}.comment-reveal label{display:block;font-size:16px;color:var(--muted);margin:4px 0 10px}#feedback-dialog textarea{font-size:18px}#feedback-dialog .send{font-size:18px}@media(prefers-reduced-motion:reduce){.comment-reveal{transition:none}}

#feedback-cancel{display:block;margin:0 auto}#feedback-success{text-align:center;padding:12px 0}#feedback-success p{line-height:1.5}#feedback-done{background:var(--mint);border:0;border-radius:8px;padding:12px 32px;font-size:18px}.front-votes button[aria-pressed=true],.detail-choices button[aria-pressed=true]{background:#daf8eb;border-color:#008a61;box-shadow:0 0 0 1px #008a61}

#feedback-dialog{padding-bottom:16px}#feedback-dialog .form{margin:0;gap:0}#feedback-dialog .feedback-picks{margin:0}#feedback-dialog .comment-reveal{margin-top:0;transition:grid-template-rows .25s ease,opacity .25s ease,margin-top .25s ease}#feedback-dialog .comment-reveal.expanded{margin-top:16px}#feedback-dialog textarea{display:block}#feedback-dialog .send{margin-top:22px}#feedback-dialog #status:empty{display:none}#feedback-dialog #status:not(:empty){margin-top:16px}#feedback-cancel{margin:16px auto 0}@media(prefers-reduced-motion:reduce){#feedback-dialog .comment-reveal{transition:none}}

.card .card-front{align-items:flex-start;gap:10px;padding:14px}.intro-title{flex-basis:100%;margin:0;font-size:14px;font-weight:600;line-height:1.4;overflow-wrap:anywhere}.front-votes{align-items:center;gap:6px;max-width:100%;flex-wrap:wrap}.card .front-votes button{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-width:40px;min-height:42px;padding:8px}.card .front-votes button[data-vote="chosen"]{padding-inline:10px}.chosen-label{font-size:12px;font-weight:600;white-space:nowrap}.card .front-votes button svg{flex-shrink:0}.card button:focus-visible,.play-all:focus-visible{outline:2px solid #008a61;outline-offset:2px}.play-all{border:1px solid var(--line);border-radius:8px;background:white;padding:10px 15px;margin-bottom:14px}.audio-card .card-front{padding:0}#feedback-prompt{font-size:16px;line-height:1.5;margin:-6px 0 18px;color:var(--muted)}
</style>
</head>
<body><main class="shell"><h1>Intro Review</h1><p class="review-prompt">Review the options and select the one you like.</p><nav class="sections" aria-label="Review type"><button class="section active" id="logo-tab" aria-pressed="true">Logo animation</button><button class="section" id="jingle-tab" aria-pressed="false">Jingle</button></nav><nav class="bar"><div class="pages" id="pages"></div></nav><button type="button" class="play-all" id="play-all" hidden>Play all animations</button><section class="grid" id="grid" data-count="0"></section><footer class="foot">Comments stay with each option so the conversation is easy to return to.</footer></main><section class="sheet" id="sheet" aria-modal="true" role="dialog"><button class="close" id="close">Close&nbsp; ×</button><div class="review"><div class="player" id="video-player"><video id="large" controls autoplay loop playsinline></video></div><div class="audio-review" id="audio-player" hidden><div class="audio-label">Listen to this jingle</div><audio id="large-audio" controls preload="metadata"></audio></div><aside class="detail"><h2 id="detail-title"></h2><div class="comments" id="feedback-section"><h3>Notes &amp; comments</h3><div class="detail-choices" id="detail-choices" aria-label="Your response"></div><div id="comments"></div></div></aside></div></section>
<dialog id="feedback-dialog" aria-labelledby="feedback-title"><div id="feedback-form-screen"><h2 id="feedback-title">Feedback</h2><p id="feedback-prompt" hidden></p><form class="form" id="form"><fieldset class="feedback-picks"><legend>Your response</legend><button type="button" id="feedback-chosen" aria-pressed="false">🎉 This Is The One</button><button type="button" id="feedback-up" aria-pressed="false">👍 I like it</button><button type="button" id="feedback-down" aria-pressed="false">👎 Not this one</button></fieldset><input type="hidden" id="reaction" name="reaction" value=""><div class="comment-reveal" id="comment-reveal" inert><div><textarea id="feedback-comment" aria-label="Add a comment" name="message" maxlength="1000" placeholder="Add a comment…" disabled></textarea></div></div><input name="website" tabindex="-1" autocomplete="off" style="position:absolute;left:-10000px" aria-hidden="true"><button class="send" disabled>Submit Feedback</button><div class="status" id="status" aria-live="polite"></div></form><button type="button" id="feedback-cancel">Cancel</button></div><div id="feedback-success" role="status" hidden><h2>Thank you!</h2><p>Your feedback has been submitted. Thank you very much.</p><button type="button" id="feedback-done">Done</button></div></dialog><!--REVIEW_SCRIPT--></body></html>
